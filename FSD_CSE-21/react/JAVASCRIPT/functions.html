        //arrow function
        const abes1=()=> "hello";
        document.write("<br>"+abes1());

        const calculator=(num1,num2,operator)=>{
            if(operator=="+"){
                return num1+num2;
            }
            else if(operator=="-"){
                return num1-num2;
            }
            else if(operator=="*"){
                return num1*num2;
            }
            else if(operator=="/"){
                return num1/num2;
            }
        }
        document.write("<br> sum of 10 and 20 is "+calculator(10,20,"+"));
    </script>
