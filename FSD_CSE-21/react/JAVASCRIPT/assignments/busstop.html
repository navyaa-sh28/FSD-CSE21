<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .card{
            background-color: #fff4e6;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 3px solid #333;
        }
        
        .header{
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo{
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #333;
            display: inline-block;
            margin-right: 10px;
            overflow: hidden;
        }
        
        .logo img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .header h2{
            color: #333;
            margin: 10px 0;
            font-size: 24px;
            display: inline;
        }
        
        .section{
            background-color: white;
            border: 2px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .section h3{
            color: #333;
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            font-size: 18px;
        }
        
        label{
            display: block;
            margin: 8px 0 3px 0;
            color: #333;
            font-weight: normal;
            font-size: 14px;
        }
        
        input[type="text"], input[type="number"], input[type="date"]{
            padding: 5px;
            margin-bottom: 8px;
            border: 1px solid #333;
            width: 70%;
        }
        
        input[type="radio"]{
            margin-right: 3px;
        }
        
        .radio-group{
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input[type="submit"]{
            background-color: #333;
            color: white;
            padding: 8px 20px;
            border: 1px solid #333;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        
        input[type="submit"]:hover{
            background-color: #555;
        }
    </style>
    <form action="">
        <div class="card">
            <div class="header">
                <div class="logo">
                    <img src="schoolbus.jpg" alt="Bus Logo">
                </div>
                <h2>Bus Booking System</h2>
            </div>
            
            <div class="section">
                <h3>User Info</h3>
                <label for="name">UserName:</label>
                <input type="text" name="name" id="name">
                
                <label for="age">User Age:</label>
                <input type="number" name="age" id="age">
                
                <label for="gender">Gender:</label>
                <div class="radio-group">
                    <input type="radio" name="gender" value="male" id="male">Male
                    <input type="radio" name="gender" value="female" id="female">Female
                </div>
                
                <label for="source">Source City:</label>
                <input type="text" name="source" id="source">
                
                <label for="destination">Destination City:</label>
                <input type="text" name="destination" id="destination">
                
                <label for="date">Journey Date:</label>
                <input type="date" name="date" id="date">
            </div>
            
            <div class="section">
                <h3>Bus Info</h3>
                <label>Bus Type:</label>
                <div class="radio-group">
                    <input type="radio" name="bustype" value="ac" id="ac">AC Bus - 2000
                    <input type="radio" name="bustype" value="nonac" id="nonac">Non-AC Bus - 1500
                </div>
                
                <label for="seat">Select Your Seat (max 5):</label>
                <input type="number" name="seat" id="seat" min="1" max="5">
            </div>
            
            <center>
                <input type="submit" value="Buy Now">
            </center>
        </div>
    </form>
</body>
</html>
